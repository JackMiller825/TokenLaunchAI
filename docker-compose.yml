services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tokenlaunch
      POSTGRES_PASSWORD: tokenlaunch
      POSTGRES_DB: tokenlaunch
    ports:
      - "5432:5432"
    volumes:
      - tokenlaunch-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokenlaunch"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  tokenlaunch-pg:
